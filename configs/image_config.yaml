# Image / Data Augmentation Configuration
# ----------------------------------------
# Controls how images are prepared and (optionally) augmented before training.
# The baseline run keeps augmentation OFF. For augmentation experiments, flip
# augmentation_enabled to true and turn on the individual options you want to test.

# The size (in pixels) that every image is resized to before training.
# EfficientNetB0 is built for 224, so keep this at 224 unless you are deliberately
# experimenting with image size (see the note in the phase docs).
image_size: 224

# --- Augmentation (TRAINING images only, never validation or test) ---
# Same option names as image_cofig.yaml where they overlap. The last three
# are extras that make bird photos look more like real uploads.
augmentation_enabled: true   # the gate uses augmentation from the start (the species baseline did not)
augmentation:
  horizontal_flip: true    # randomly mirror the image left-to-right
  vertical_flip: false     # birds are not usually upside down
  rotation: 0.1            # random rotation, as a fraction of a full turn
  zoom: 0.3                # random zoom in or out (bigger = bird looks farther away)
  brightness: 0.1          # random brightness change
  contrast: 0.1            # random contrast change
  random_crop: true        # sometimes cuts off part of the bird
  blur: true               # simulates blurry photos
  low_res_resize: true     # shrinks then re-enlarges the image