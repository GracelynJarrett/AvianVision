# Hypertuning Experiments Configuration
# ----------------------------------------
# Each entry below is one hypertuning experiment. To run one, pass its name to
# hypertuning.py with the --run flag:
#
#   python src/hypertuning.py --run base-frozen-HT
#
# Experiments are organized into 6 groups based on which sections of EfficientNetB0
# are frozen. Within each group, 4 runs vary one knob at a time (LR, dropout/epochs,
# batch size) so results can be compared cleanly.
#
# Section definitions:
#   base   = Blocks 1-2 (early layers — edges, colors, textures)
#   middle = Blocks 3-5 (mid layers — shapes and patterns)
#   end    = Blocks 6-7 (top layers — high-level, bird-specific features)


# --- BASE FROZEN (middle + end can train) ---

base-frozen-HT: # Done
  freeze_base: true
  freeze_middle: false
  freeze_end: false
  learning_rate: 0.0001
  dropout: 0.2
  epochs: 10
  batch_size: 32
  optimizer: adam

base-frozen-low-lr-HT: # Done
  freeze_base: true
  freeze_middle: false
  freeze_end: false
  learning_rate: 0.00005
  dropout: 0.2
  epochs: 10
  batch_size: 32
  optimizer: adam

base-frozen-low-dropout-HT: # Done
  freeze_base: true
  freeze_middle: false
  freeze_end: false
  learning_rate: 0.0001
  dropout: 0.1
  epochs: 15
  batch_size: 32
  optimizer: adam

base-frozen-large-batch-HT: # Done
  freeze_base: true
  freeze_middle: false
  freeze_end: false
  learning_rate: 0.0001
  dropout: 0.2
  epochs: 10
  batch_size: 64
  optimizer: adam


